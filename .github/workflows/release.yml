name: Release

# Builds a universal Jayson.app, attaches it to the GitHub Release for the pushed tag,
# and (when a HOMEBREW_TAP_TOKEN secret exists) updates Casks/jayson.rb in the tap repo.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  HOMEBREW_TAP_REPO: axel-eck/homebrew-tap

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches VERSION
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE="$(tr -d '[:space:]' < VERSION)"
          if [[ "$TAG" != "$FILE" ]]; then
            echo "Tag v$TAG does not match VERSION ($FILE)"; exit 1
          fi

      - name: Import signing certificate
        if: ${{ secrets.DEVELOPER_ID_P12 != '' }}
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          echo "$P12_BASE64" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          echo "CODESIGN_IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')" >> "$GITHUB_ENV"

      - name: Store notarization credentials
        if: ${{ secrets.NOTARY_APPLE_ID != '' }}
        run: |
          xcrun notarytool store-credentials ci-notary \
            --apple-id "${{ secrets.NOTARY_APPLE_ID }}" \
            --team-id "${{ secrets.NOTARY_TEAM_ID }}" \
            --password "${{ secrets.NOTARY_APP_PASSWORD }}"
          echo "NOTARY_PROFILE=ci-notary" >> "$GITHUB_ENV"

      - name: Build release
        env:
          GITHUB_REPO: ${{ github.repository }}
        run: Scripts/release.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          gh release create "v$VERSION" "dist/Jayson-$VERSION.zip" \
            --title "Jayson $VERSION" --generate-notes

      - name: Update Homebrew tap
        if: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${HOMEBREW_TAP_REPO}.git" tap
          mkdir -p tap/Casks
          cp dist/jayson.rb tap/Casks/jayson.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/jayson.rb
          git commit -m "jayson $VERSION" || echo "cask unchanged"
          git push
